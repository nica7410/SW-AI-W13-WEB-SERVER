# PR·push마다 일반 서버의 단위·기능·종료 검사 및 sanitizer 단위 검사
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CFLAGS: -std=gnu11 -Wall -Wextra -Werror -g -O2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: HTTP and proxy integration
        run: bash tests/functional.sh
      - name: Graceful shutdown
        run: python3 tests/test_shutdown.py
      - name: AddressSanitizer
        run: make asan
