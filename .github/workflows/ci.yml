# Ubuntu 통합 검사와 macOS 이식성 검사
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CFLAGS: -std=gnu11 -Wall -Wextra -Werror -g -O2

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: HTTP and proxy integration
        run: bash tests/functional.sh
      - name: Graceful shutdown
        run: python3 tests/test_shutdown.py
      - name: AddressSanitizer
        run: make asan

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
